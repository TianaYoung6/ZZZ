<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

  <!-- ─── 1. 主视觉 ─── -->
  <section class="sec-hero">
    <img src="assets/首页/主视觉.png" alt="" draggable="false">
  </section>

  <!-- ─── 2. 横幅 ─── -->
  <section class="sec-banner">
    <img src="assets/首页/横幅.png" alt="" draggable="false">
  </section>

  <!-- ─── 3. 能力模型：左文字栏 + 右环形轨道 ─── -->
  <section class="sec-orbit">

    <!-- 左：文字栏 -->
    <div class="text-col">
      <img class="sec-title" src="assets/首页/我的优势.png" alt="我的优势" draggable="false">

      <div class="text-block">
        <h2>Ai时代所需【复合型能力】</h2>
        <div class="desc-row">
          <span class="sep"></span>
          <p>关注体验、具有产品视角、工作中以产品角色迭代项目落地，了解代码原理懂实现，Vibe Coding 落地项目</p>
        </div>
      </div>

      <div class="text-block">
        <h2>专业深度 &amp; 业务全面</h2>
        <div class="desc-row">
          <span class="sep"></span>
          <p>专业的交互能力、业务线设计接口人、主导用户研究<br>接触项目类型多、涉及C端、B端、硬件等</p>
        </div>
      </div>

      <div class="text-block">
        <h2>个人属性</h2>
        <div class="desc-row">
          <span class="sep"></span>
          <p>发现并解决问题能力、结果导向、效率导向、高适应性；优秀的学习能力、逻辑思维、理解与表达</p>
        </div>
      </div>
    </div>

    <!-- 右：环形轨道（bleed 出右边，section overflow hidden 裁剪） -->
    <div class="orbit-wrap">
      <div class="orbit-system" id="orbit">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="ring r4"></div>
        <div class="orbit-center">项目<br>关键词</div>
        <!-- 标签由 script.js 注入 -->
        <div class="tags" id="orbit-tags"></div>
      </div>
    </div>

  </section>

  <!-- ─── 4. 底部作品展示区 ─── -->
  <section class="sec-gallery">
    <div class="gallery-inner">

      <!-- 4-1 项目概览组：小标题 + 项目概览主图（播放按钮 + 滚动条叠在图上） -->
      <div class="group group-overview">
        <img class="grp-title" src="assets/首页/项目概览.png" alt="" draggable="false">
        <div class="img-frame img-overview">
          <img src="assets/首页/项目概览主图.png" alt="" draggable="false">
          <img class="play-btn" src="assets/首页/播放.png" alt="播放" draggable="false">
          <div class="marquee-overlay">
            <div class="marquee" style="--marquee-count:5">
              <div class="marquee-track" id="marquee-track"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 4-2 展示图（不放大） -->
      <div class="img-frame showcase">
        <img src="assets/首页/展示图.png" alt="" draggable="false">
      </div>

      <!-- 4-3 三连图组 + 小标题 -->
      <div class="group group-triple">
        <img class="grp-title" src="assets/首页/三连图-标题.png" alt="" draggable="false">
        <div class="triple-stack">
          <a class="img-frame" href="Vibe Coding.html" target="_blank" rel="noopener" style="display:block"
            aria-label="Vibe Coding"><img class="zoomable" src="assets/首页/三连图-1.png" alt="Vibe Coding"
              draggable="false"></a>
          <div class="img-frame"><img class="zoomable" src="assets/首页/三连图-2.png" alt="" draggable="false"></div>
          <div class="img-frame"><img class="zoomable" src="assets/首页/三连图-3.png" alt="" draggable="false"></div>
        </div>
      </div>

      <!-- 4-4 四宫格组 + 小标题 -->
      <div class="group group-grid">
        <img class="grp-title" src="assets/首页/四宫格-标题.png" alt="" draggable="false">
        <div class="grid-4">
          <div class="img-frame"><img class="zoomable" src="assets/首页/四宫格-1.png" alt="" draggable="false"></div>
          <div class="img-frame"><img class="zoomable" src="assets/首页/四宫格-2.png" alt="" draggable="false"></div>
          <div class="img-frame"><img class="zoomable" src="assets/首页/四宫格-3.png" alt="" draggable="false"></div>
          <div class="img-frame"><img class="zoomable" src="assets/首页/四宫格-4.png" alt="" draggable="false"></div>
        </div>
      </div>

    </div>
  </section>

  <script src="script.js?v=2"></script>
</body>

</html>
