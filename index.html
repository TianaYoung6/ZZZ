<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: #05050f;
      color: #fff;
      font-family: 'PingFang SC', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      overflow-x: hidden;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       SECTION 1 — Hero (VUh5g  1600×816)
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .sec-hero {
      width: 100%;
      aspect-ratio: 1600 / 816;
      overflow: hidden;
      background: #08081a;
    }
    .sec-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       SECTION 2 — Middle (L73ZzZ  1600×1091)
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .sec-middle {
      width: 100%;
      aspect-ratio: 1600 / 1091;
      overflow: hidden;
      background: #070714;
    }
    .sec-middle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 10px gap at 1600 design */
    .gap-10 {
      width: 100%;
      height: calc(10 / 1600 * 100vw);
      background: #05050f;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       SECTION 3 — Staggered 4 Photos
       FPVxV group: x=170, y=1917
       Container height = 78+540 = 618px @ 1600
       Photo positions (canvas absolute → %):
         01.png  x=170 y=0
         02.png  x=490 y=69
         03.png  x=810 y=6
         04.png  x=1130 y=78
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .sec-photos {
      position: relative;
      width: 100%;
      height: calc(618 / 1600 * 100vw);
      background: #05050f;
    }

    .photo-card {
      position: absolute;
      width: calc(300 / 1600 * 100vw);
      height: calc(540 / 1600 * 100vw);
      overflow: hidden;
      display: block;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.04);
      border: none;
      text-decoration: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .photo-card:hover { opacity: 0.88; transform: scale(1.025); }
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-1 { left: calc(170 / 1600 * 100%); top: calc(0  / 618 * 100%); }
    .photo-2 { left: calc(490 / 1600 * 100%); top: calc(69 / 618 * 100%); }
    .photo-3 { left: calc(810 / 1600 * 100%); top: calc(6  / 618 * 100%); }
    .photo-4 { left: calc(1130/ 1600 * 100%); top: calc(78 / 618 * 100%); }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       SECTION 4 — Strip (WfhJh  1600×300)
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .sec-strip {
      width: 100%;
      aspect-ratio: 1600 / 300;
      overflow: hidden;
      background: #0b0b1c;
    }
    .sec-strip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       SECTION 5 — Cards Grid
       vnTPy: x=110, vertical layout, gap=30
       4 rows × 3 cards (440×440 r=20) gap=30
       Padding left/right: 110px @ 1600
       Bottom: 204px canvas remainder
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .sec-grid {
      background: #05050f;
      padding-left:   calc(110 / 1600 * 100vw);
      padding-right:  calc(110 / 1600 * 100vw);
      padding-bottom: calc(204 / 1600 * 100vw);
    }

    .grid-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: calc(30 / 1600 * 100vw);
    }
    .grid-row + .grid-row {
      margin-top: calc(30 / 1600 * 100vw);
    }

    /* Card: 440×440 square, cornerRadius=20 */
    .card {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: clamp(4px, calc(20 / 1600 * 100vw), 20px);
      overflow: hidden;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.10);
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Clickable card with play button (3rd column) */
    .card-play {
      display: block;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.22s ease;
    }
    .card-play:hover { opacity: 0.88; }

    /* next.png: 80×80, 距右下各16px，随卡片等比缩放 */
    .next-icon {
      position: absolute;
      right:  clamp(4px,  calc(16 / 1600 * 100vw), 16px);
      bottom: clamp(4px,  calc(16 / 1600 * 100vw), 16px);
      width:  clamp(20px, calc(80 / 1600 * 100vw), 80px);
      height: clamp(20px, calc(80 / 1600 * 100vw), 80px);
      object-fit: contain;
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       MODAL  (弹窗 artboard — pdPs0)
       Overlay (zEPSx): fill=#000000b2
       Modal (RqlDH): 1200×908, x=200 y=120
         cornerRadius=[40,40,0,0]  fill=#fff
       Title bar (uCWzj): height=80
         padding=[11.71875, 93.75]
         text: fontSize=32, letterSpacing=3.2
       Close btn (kU96f): 28.125×28.125
         X path: 14.728×14.728 @ (5,5) in btn
       Content (b0fAy): height=820, padding=[0,40]
         scroll, images from 首页/数据可视化/
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.698);
      z-index: 9000;
      padding-top: 60px;
      overflow-y: hidden;
    }
    #modal-overlay.open {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    #modal-overlay.open #modal-window {
      animation: modal-in 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes modal-in {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #modal-window {
      width: clamp(300px, calc(1200 / 1600 * 100vw), 1200px);
      height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
      border-radius:
        clamp(12px, calc(40 / 1600 * 100vw), 40px)
        clamp(12px, calc(40 / 1600 * 100vw), 40px)
        0 0;
      background: #fff;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    }

    .modal-header {
      position: relative;
      flex-shrink: 0;
      width: 100%;
      height: clamp(44px, calc(80 / 1600 * 100vw), 80px);
      border-radius:
        clamp(12px, calc(40 / 1600 * 100vw), 40px)
        clamp(12px, calc(40 / 1600 * 100vw), 40px)
        0 0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        clamp(5px,  calc(11.71875 / 1600 * 100vw), 11.71875px)
        clamp(20px, calc(93.75   / 1600 * 100vw), 93.75px);
      /* no border / shadow on title bar */
    }

    .modal-title {
      font-family: 'PingFang SC', -apple-system, sans-serif;
      font-size: clamp(14px, calc(32 / 1600 * 100vw), 32px);
      font-weight: 700;
      color: #000;
      letter-spacing: 0.1em;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-close {
      position: absolute;
      right: clamp(10px, calc(28.125 / 1600 * 100vw), 28.125px);
      top: 50%;
      transform: translateY(-50%);
      width:  32px;
      height: 32px;
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }
    .modal-close:focus { outline: none; }
    .modal-close:hover { opacity: 0.6; }
    .modal-close img { width: 32px; height: 32px; object-fit: contain; display: block; }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 clamp(12px, calc(40 / 1600 * 100vw), 40px);
      display: flex;
      flex-direction: column;
      background: #fff;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,0,0,0.2) transparent;
    }
    .modal-body::-webkit-scrollbar { width: 4px; }
    .modal-body::-webkit-scrollbar-track { background: transparent; }
    .modal-body::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.2);
      border-radius: 2px;
    }

    /* Modal content images — natural dimensions, fill padded width */
    .modal-body img {
      width: 100%;
      height: auto;
      display: block;
      flex-shrink: 0;
      background: rgba(0,0,0,0.03);
    }
    /* 数据1 (jmBBp): cornerRadius=20 */
    .mi-r20 {
      border-radius: clamp(4px, calc(20 / 1600 * 100vw), 20px);
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RESPONSIVE — tablet ≤ 1024px
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    @media (max-width: 1024px) {
      .sec-grid {
        padding-left:  clamp(16px, calc(60 / 1024 * 100vw), 60px);
        padding-right: clamp(16px, calc(60 / 1024 * 100vw), 60px);
      }
    }

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RESPONSIVE — mobile ≤ 640px
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    @media (max-width: 640px) {
      .sec-photos {
        height: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 0 8px;
      }
      .photo-card {
        position: static;
        width: 100%;
        height: auto;
        aspect-ratio: 300 / 540;
        transform: none !important;
      }
      .grid-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .grid-row + .grid-row { margin-top: 8px; }
      .sec-grid {
        padding-left: 8px;
        padding-right: 8px;
        padding-bottom: 32px;
      }
      #modal-window {
        width: 100%;
        border-radius: 20px 20px 0 0;
      }
      .modal-title { font-size: 16px; letter-spacing: 0.08em; }
      #modal-window { height: calc(100vh - 60px); }
    }
  </style>
</head>
<body>

  <!-- ─── Section 1: Hero → 首页/杨天存.png ─── -->
  <section class="sec-hero">
    <img src="首页/杨天存.png" alt="" draggable="false">
  </section>

  <!-- ─── Section 2: Middle → 首页/能力模型.png ─── -->
  <section class="sec-middle">
    <img src="首页/能力模型.png" alt="" draggable="false">
  </section>

  <!-- 10px gap (canvas y:1907→1917) -->
  <div class="gap-10"></div>

  <!-- ─── Section 3: 4 Staggered Photos ───
       Canvas positions (absolute):
         01.png  x=170  y=0    → leftmost → Ai赋能篇.html
         02.png  x=490  y=69
         03.png  x=810  y=6
         04.png  x=1130 y=78
       Note: 01 .png has a space in filename → encoded as 01%20.png
  ─── -->
  <section class="sec-photos">
    <a href="Ai赋能篇.html" class="photo-card photo-1" aria-label="Ai赋能篇">
      <img src="首页/01%20.png" alt="">
    </a>
    <a href="#" class="photo-card photo-2">
      <img src="首页/02.png" alt="">
    </a>
    <a href="#" class="photo-card photo-3">
      <img src="首页/03.png" alt="">
    </a>
    <a href="#" class="photo-card photo-4">
      <img src="首页/04.png" alt="">
    </a>
  </section>

  <!-- 10px gap (canvas y:2535→2545) -->
  <div class="gap-10"></div>

  <!-- ─── Section 4: Strip → 首页/过往项目.png ─── -->
  <section class="sec-strip">
    <img src="首页/过往项目.png" alt="" draggable="false">
  </section>

  <!-- ─── Section 5: 4-Row Cards Grid ───
       vnTPy: x=110, gap=30, cornerRadius=20
       Order L→R T→B: 1.png … 11.png, next.png
       3rd column (positions 3,6,9,12) → play btn + opens modal
  ─── -->
  <section class="sec-grid">

    <!-- Row 1: 1 · 2 · 3 -->
    <div class="grid-row">
      <div class="card">
        <img src="首页/1.png" alt="">
      </div>
      <div class="card">
        <img src="首页/2.png" alt="">
      </div>
      <a class="card card-play" role="button" aria-haspopup="dialog">
        <img src="首页/3.png" alt="">
      </a>
    </div>

    <!-- Row 2: 4 · 5 · 6 -->
    <div class="grid-row">
      <div class="card">
        <img src="首页/4.png" alt="">
      </div>
      <div class="card">
        <img src="首页/5.png" alt="">
      </div>
      <a class="card card-play" role="button" aria-haspopup="dialog">
        <img src="首页/6.png" alt="">
      </a>
    </div>

    <!-- Row 3: 7 · 8 · 9 -->
    <div class="grid-row">
      <div class="card">
        <img src="首页/7.png" alt="">
      </div>
      <div class="card">
        <img src="首页/8.png" alt="">
      </div>
      <a class="card card-play" role="button" aria-haspopup="dialog">
        <img src="首页/9.png" alt="">
      </a>
    </div>

    <!-- Row 4: 10 · 11 · next.png -->
    <div class="grid-row">
      <div class="card">
        <img src="首页/10.png" alt="">
      </div>
      <div class="card">
        <img src="首页/11.png" alt="">
      </div>
      <a class="card card-play" role="button" aria-haspopup="dialog">
        <img src="首页/next.png" class="next-icon" alt="">
      </a>
    </div>

  </section>


  <!-- ═══════════════════════════════════════════════
       MODAL  (弹窗 artboard)
       Content images: 首页/数据可视化/数据1~7.png
  ═══════════════════════════════════════════════ -->
  <div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title-text">

    <div id="modal-window">

      <!-- Title bar (rLxMw + VgfdQ) -->
      <div class="modal-header">
        <span class="modal-title" id="modal-title-text">设计研究 - BI数据看板</span>
        <!-- Close button — 首页/关闭.png -->
        <button class="modal-close" id="modal-close" aria-label="关闭">
          <img src="首页/关闭.png" alt="关闭" style="width:100%;height:100%;object-fit:contain;display:block;">
        </button>
      </div>

      <!-- Content area (b0fAy): padding=[0,40], overflow scroll
           数据1 → jmBBp (cornerRadius=20)
           数据2 → EGFOw (EuWmb group)
           数据3~7 → wv971, Gdp4g, U0Lcd, VzaGB, TAOgQ -->
      <div class="modal-body" id="modal-body">
        <img src="首页/数据可视化/数据1.png" class="mi-r20" alt="">
        <img src="首页/数据可视化/数据2.png" alt="">
        <img src="首页/数据可视化/数据3.png" alt="">
        <img src="首页/数据可视化/数据4.png" alt="">
        <img src="首页/数据可视化/数据5.png" alt="">
        <img src="首页/数据可视化/数据6.png" alt="">
        <img src="首页/数据可视化/数据7.png" alt="">
      </div>

    </div>
  </div>


  <script>
    /* ─────────────────────────────────────
       MODAL — open / close
    ───────────────────────────────────── */
    const overlay   = document.getElementById('modal-overlay');
    const closeBtn  = document.getElementById('modal-close');
    const modalBody = document.getElementById('modal-body');

    function openModal() {
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      modalBody.scrollTop = 0;
      closeBtn.focus();
    }

    function closeModal() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    /* All play-button cards (3rd column) trigger the modal */
    document.querySelectorAll('.card-play').forEach(card => {
      card.addEventListener('click', function (e) {
        e.preventDefault();
        openModal();
      });
    });

    /* Close: X button */
    closeBtn.addEventListener('click', closeModal);

    /* Close: click dark overlay (outside modal window) */
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeModal();
    });

    /* Close: Escape key */
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
    });
  </script>

</body>
</html>
