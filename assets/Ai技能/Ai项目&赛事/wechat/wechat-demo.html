<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>学小思1V1顾问</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #EDEDED;
      --bubble-sent: #95EC6A;
      --bubble-recv: #FFFFFF;
      --text-sent: #092400;
      --text-recv: #484848;
      --text-ts: #AAAAAA;
    }

    html, body {
      overflow: hidden;
      height: 100%;
    }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      padding: 40px 60px 40px 240px;
    }

    /* ── Overall demo layout ── */
    .demo-layout {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 52px;
    }

    /* ── Phone wrapper — annotations anchor here ── */
    .phone-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    /* ── Floating annotation bubble ── */
    .float-ann {
      position: absolute;
      left: 0;
      width: max-content;
      background: rgba(14, 10, 4, 0.92);
      border: 1.5px solid #BF9848;
      color: #F4D198;
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transform: translateX(-100%) translateX(-25px) translateY(-50%);
      transition: opacity .4s ease;
      z-index: 20;
      white-space: nowrap;
    }
    /* Arrow pointing right → toward phone */
    .float-ann::after {
      content: '';
      position: absolute;
      right: -8px;
      top: 50%;
      transform: translateY(-50%);
      border: 7px solid transparent;
      border-left: 8px solid #BF9848;
      border-right: 0;
    }
    .float-ann.visible { opacity: 1; }

    /* ── Scene list (right side) ── */
    .scene-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 240px;
      flex-shrink: 0;
    }
    .scene-card {
      background: #252525;
      border: 1.5px solid #383838;
      border-radius: 14px;
      padding: 16px 20px;
      cursor: pointer;
      transition: background .2s, border-color .2s;
      user-select: none;
    }
    .scene-card:hover { background: #303030; border-color: #555; }
    .scene-card.active { background: #3a3020; border-color: #BF9848; }
    .scene-card.active .sc-title { color: #c8a86a; }
    .scene-card.active .sc-sub { color: #F4D198; }
    .scene-card .sc-title { font-size: 13px; color: #888; line-height: 1.4; margin-bottom: 4px; }
    .scene-card .sc-sub { font-size: 18px; font-weight: 600; color: #fff; line-height: 1.3; }

    /* 可交互图片：场景1右侧对齐 */
    .scene-area {
      position: relative;
    }
    .scene-interactive-img {
      position: absolute;
      left: calc(100% + 12px);
      top: 0;
      width: auto;
      height: auto;
      max-width: 130px;
      pointer-events: none;
    }

    /* ── Phone shell ── */
    .phone {
      width: 390px;
      height: 844px;
      zoom: 0.85;
      background: var(--bg);
      border-radius: 52px;
      box-shadow: 0 0 0 12px #1a1a1a, 0 0 0 14px #333, 0 30px 80px rgba(0,0,0,.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── Status bar ── */
    .status-bar {
      height: 48px;
      background: #EFEFEF;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 8px;
      flex-shrink: 0;
    }

    .status-time { font-size: 15px; font-weight: 600; color: #000; }
    .status-icons { display: flex; gap: 6px; align-items: center; }
    .status-icons svg { width: 18px; height: 18px; }
    .status-icons img { height: 14px; width: auto; display: block; }

    /* ── Header ── */
    .header {
      height: 44px;
      background: #EDEDED;
      border-bottom: 0.5px solid #C8C8C8;
      display: flex;
      align-items: center;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .header-back {
      width: 44px;
      display: flex;
      align-items: center;
    }

    .header-back svg { width: 11px; height: 19px; }

    .header-title {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .header-name { font-size: 16px; font-weight: 500; color: #000; line-height: 1; }
    .header-sub  { font-size: 8px;  font-weight: 500; color: #666; line-height: 1; }

    .header-more {
      width: 44px;
      text-align: right;
      font-size: 18px;
      font-weight: 700;
      color: #000;
      letter-spacing: 1px;
    }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 8px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { display: none; }

    /* Timestamp */
    .ts-wrap { text-align: center; margin: 4px 0 12px; }
    .timestamp { font-size: 13px; color: var(--text-ts); }

    /* (inline annotation removed — floating bubbles used instead) */

    /* Row — KEY FIX: both recv/sent append [av, bubble]; row-reverse handles sent layout */
    .msg-row {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .3s, transform .3s;
    }
    .msg-row.visible { opacity: 1; transform: none; }
    .msg-row.sent { flex-direction: row-reverse; }

    /* Avatar */
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 5px;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* Sent avatar: bunny */
    .av-sent {
      background: #F0E6CC;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Recv avatar: woman portrait */
    .av-recv {
      background: linear-gradient(160deg, #E8D5C5 0%, #C8A090 100%);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Text bubble ── */
    .bubble-text {
      max-width: 240px;
      padding: 8px 10px;
      font-size: 15px;
      line-height: 1.5;
      position: relative;
      word-break: break-word;
    }

    .msg-row.recv .bubble-text {
      background: var(--bubble-recv);
      color: var(--text-recv);
      border-radius: 5px;
      box-shadow: 0 1px 2px rgba(0,0,0,.07);
    }
    .msg-row.recv .bubble-text::before {
      content: '';
      position: absolute;
      left: -7px; top: 10px;
      border: 8px solid transparent;
      border-right-color: var(--bubble-recv);
      border-left: 0;
    }

    .msg-row.sent .bubble-text {
      background: var(--bubble-sent);
      color: var(--text-sent);
      border-radius: 5px;
    }
    .msg-row.sent .bubble-text::after {
      content: '';
      position: absolute;
      right: -7px; top: 10px;
      border: 8px solid transparent;
      border-left-color: var(--bubble-sent);
      border-right: 0;
    }

    /* ── Voice bubble ── */
    .bubble-voice {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 5px;
      position: relative;
      min-width: 88px;
    }
    .msg-row.sent .bubble-voice {
      background: var(--bubble-sent);
      border-radius: 5px 0 5px 5px;
      flex-direction: row-reverse;
    }
    .msg-row.sent .bubble-voice::after {
      content: '';
      position: absolute;
      right: -8px; top: 10px;
      border: 8px solid transparent;
      border-left-color: var(--bubble-sent);
      border-right: 0;
    }
    .msg-row.recv .bubble-voice {
      background: var(--bubble-recv);
      border-radius: 0 5px 5px 5px;
      box-shadow: 0 1px 2px rgba(0,0,0,.07);
    }
    .msg-row.recv .bubble-voice::before {
      content: '';
      position: absolute;
      left: -8px; top: 10px;
      border: 8px solid transparent;
      border-right-color: var(--bubble-recv);
      border-left: 0;
    }
    .voice-waves { display: flex; align-items: center; gap: 2px; }
    .voice-waves span { display: block; width: 3px; background: rgba(0,0,0,.65); border-radius: 2px; }
    .voice-waves span:nth-child(1) { height: 6px; }
    .voice-waves span:nth-child(2) { height: 10px; }
    .voice-waves span:nth-child(3) { height: 16px; }
    .voice-dur { font-size: 14px; color: #000; }

    /* ── Video bubble ── */
    .bubble-video {
      width: 104px;
      height: 188px;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }
    .bubble-video video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .bubble-video .vplay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 52px; height: 52px;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .bubble-video .vplay img { width: 52px; height: 52px; display: block; pointer-events: none; }
    .bubble-video .vdur { pointer-events: none; }
    .bubble-video .vdur {
      position: absolute;
      bottom: 8px; right: 8px;
      font-size: 12px; color: #fff;
      background: rgba(0,0,0,.45);
      padding: 2px 6px;
      border-radius: 3px;
    }

    /* ── In-phone video player ── */
    .phone-video-player {
      display: none;
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 50;
      flex-direction: column;
    }
    .phone-video-player.open { display: flex; }
    .phone-video-player video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      outline: none;
    }
    /* Custom controls */
    .pvp-controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 52px;
      background: linear-gradient(transparent, rgba(0,0,0,.55));
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      z-index: 61;
    }
    .pvp-play-btn {
      background: none; border: none; cursor: pointer;
      color: #fff; font-size: 18px; line-height: 1;
      flex-shrink: 0; padding: 4px;
    }
    .pvp-seek {
      flex: 1; height: 3px; cursor: pointer;
      accent-color: #fff;
    }
    .pvp-time {
      font-size: 12px; color: #fff; white-space: nowrap; flex-shrink: 0;
    }
    .pvp-mute-btn {
      background: none; border: none; cursor: pointer;
      color: #fff; font-size: 18px; line-height: 1;
      flex-shrink: 0; padding: 4px;
    }
    /* Hide annotations while video plays */
    .phone-wrapper.video-playing .float-ann { opacity: 0 !important; transition: none; }
    .pvp-close {
      position: absolute;
      top: 18px; left: 18px;
      width: 44px; height: 44px;
      background: rgba(0,0,0,.6);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
    }
    .pvp-close svg { display: block; }

    /* ── Sending dots ── */
    .sending-dot { align-self: flex-end; margin-bottom: 4px; display: flex; gap: 3px; }
    .sending-dot span {
      width: 5px; height: 5px; background: #aaa; border-radius: 50%;
      animation: dotPulse 1s ease-in-out infinite;
    }
    .sending-dot span:nth-child(2) { animation-delay: .15s; }
    .sending-dot span:nth-child(3) { animation-delay: .3s; }
    @keyframes dotPulse {
      0%,80%,100% { transform: scale(.6); opacity: .4; }
      40%          { transform: scale(1);  opacity: 1;  }
    }

    /* ── Input bar ── */
    .input-bar {
      background: rgba(247,247,247,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 0.5px solid rgba(0,0,0,.12);
      padding: 8px 8px 24px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }
    .phone.keyboard-open .input-bar { padding-bottom: 8px; }

    .input-icon {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-bottom: 3px;
    }
    .input-icon img { width: 28px; height: 28px; opacity: .75; }

    .input-field {
      flex: 1;
      min-height: 38px;
      max-height: 132px;
      background: #fff;
      border-radius: 4px;
      border: 0.5px solid #D4D4D4;
      padding: 8px 10px;
      font-size: 15px;
      letter-spacing: 1.5px;
      outline: none;
      caret-color: #07C160;
      font-family: inherit;
      color: #484848;
      resize: none;
      overflow-y: auto;
      line-height: 1.45;
      display: block;
    }
    .input-field::-webkit-scrollbar { display: none; }

    /* ── iOS Keyboard simulation ── */
    .keyboard-sim {
      flex-shrink: 0;
      height: 0;
      overflow: hidden;
      background: #CBD0D8;
      transition: height .28s cubic-bezier(0.32,0.72,0,1);
    }
    .phone.keyboard-open .keyboard-sim { height: 300px; }

    /* Predictive bar */
    .kb-pred {
      height: 44px;
      background: #CFD3DA;
      border-bottom: 0.5px solid #B2B2B2;
      display: flex;
      align-items: center;
      padding: 0 6px;
    }
    .kb-pred-words {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0;
    }
    .kb-pred-words span {
      flex: 1;
      text-align: center;
      font-size: 15px;
      color: #000;
      padding: 6px 0;
    }
    .kb-pred-sep {
      width: 0.5px;
      height: 24px;
      background: #B2B5BB;
    }
    .kb-pred-collapse {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #555;
    }

    /* Key rows */
    .kb-rows {
      padding: 6px 4px 0;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .kb-row {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    /* Normal key */
    .kb-k {
      flex: 1;
      max-width: 36px;
      height: 43px;
      background: #fff;
      border-radius: 5px;
      box-shadow: 0 1px 0 #8A8F97, 0 0 0 0.5px rgba(0,0,0,.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #000;
      cursor: pointer;
      user-select: none;
    }
    /* Special key (shift, delete, 123, emoji) */
    .kb-k.sp {
      background: #ADB5BD;
      color: #000;
      font-size: 14px;
    }
    .kb-k.sp-wide { max-width: 52px; font-size: 13px; }
    .kb-k.sp-del  { max-width: 52px; font-size: 18px; }
    .kb-k.sp-shf  { max-width: 48px; font-size: 18px; }
    .kb-k.sp-emo  { max-width: 42px; font-size: 18px; }
    .kb-k.sp-spc  { max-width: 170px; flex: 4; font-size: 15px; color: #888; background: #fff; }
    .kb-k.sp-snd  { max-width: 64px; font-size: 15px; color: #555; }

    /* Keyboard footer */
    .kb-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 14px 2px;
    }
    .kb-foot-icon { font-size: 18px; }
    .kb-home-bar {
      width: 120px; height: 5px;
      background: rgba(0,0,0,.28);
      border-radius: 3px;
    }

    /* (scene tabs replaced by scene-list in demo-layout) */

    /* ── Annotation area gradient mask ── */
    .ann-mask {
      position: absolute;
      right: calc(100% + 19px);
      top: -150px;
      width: 280px;
      height: calc(844px * 0.85 + 300px);
      pointer-events: none;
      z-index: 25;
      background: linear-gradient(
        to bottom,
        #111 0,
        #111 200px,
        transparent 245px,
        transparent calc(150px + 0.82 * 844px * 0.85),
        #111 calc(150px + 0.92 * 844px * 0.85),
        #111 100%
      );
    }

    /* ── In-phone webview ── */
    .phone-webview {
      display: none;
      position: absolute;
      inset: 0;
      background: #fff;
      z-index: 55;
      flex-direction: column;
    }
    .phone-webview.open { display: flex; }
    .pwv-bar {
      height: 44px;
      background: #EDEDED;
      border-bottom: 0.5px solid #C8C8C8;
      display: flex;
      align-items: center;
      padding: 0 16px;
      flex-shrink: 0;
    }
    .pwv-close {
      width: 44px;
      display: flex;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    .pwv-title {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .pwv-title-name { font-size: 16px; font-weight: 500; color: #000; line-height: 1; }
    .pwv-title-sub  { font-size: 8px;  font-weight: 500; color: #666; line-height: 1; }
    .pwv-more {
      width: 44px;
      text-align: right;
      font-size: 18px;
      font-weight: 700;
      color: #000;
      letter-spacing: 1px;
    }
    .phone-webview iframe {
      flex: 1;
      width: 100%;
      border: none;
    }

    /* URL link inside bubble */
    .bubble-text a {
      color: #1677ff;
      word-break: break-all;
      text-decoration: underline;
      cursor: pointer;
    }

  </style>
</head>

<body>
<div class="demo-layout">
<div class="phone-wrapper" id="phoneWrapper">
<div class="ann-mask"></div>
<div class="phone" id="phone">

  <!-- Status bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <!-- Signal bars -->
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
        <rect x="0" y="7.5" width="2.5" height="4.5" rx="0.8" fill="black"/>
        <rect x="4" y="5" width="2.5" height="7" rx="0.8" fill="black"/>
        <rect x="8" y="2.5" width="2.5" height="9.5" rx="0.8" fill="black"/>
        <rect x="12" y="0" width="2.5" height="12" rx="0.8" fill="black"/>
      </svg>
      <img src="WIFI.svg" alt="wifi">
      <img src="Light.svg" alt="battery">
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-back">
      <svg viewBox="0 0 11 19" fill="none">
        <path d="M9.5 1L1 9.5l8.5 8.5" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="header-title">
      <span class="header-name">学小思1V1顾问</span>
      <span class="header-sub">好未来官方服务官</span>
    </div>
    <div class="header-more">
      <img src="more.svg" alt="more" style="width:28px;height:28px;">
    </div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages"></div>

  <!-- Input bar -->
  <div class="input-bar">
    <div class="input-icon"><img src="左侧图标.svg" alt=""></div>
    <textarea class="input-field" id="inputField" rows="1"></textarea>
    <div class="input-icon"><img src="右侧图标2.svg" alt=""></div>
    <div class="input-icon"><img src="右侧图标1.svg" alt=""></div>
  </div>

  <!-- Keyboard simulation -->
  <div class="keyboard-sim" id="keyboardSim">
    <!-- Predictive text bar -->
    <div class="kb-pred">
      <div class="kb-pred-words">
        <span>我</span><div class="kb-pred-sep"></div>
        <span>你</span><div class="kb-pred-sep"></div>
        <span>不</span><div class="kb-pred-sep"></div>
        <span>哈哈</span><div class="kb-pred-sep"></div>
        <span>好</span><div class="kb-pred-sep"></div>
        <span>但是</span>
      </div>
      <div class="kb-pred-collapse">˅</div>
    </div>
    <!-- Key rows -->
    <div class="kb-rows">
      <div class="kb-row">
        <div class="kb-k">q</div><div class="kb-k">w</div><div class="kb-k">e</div>
        <div class="kb-k">r</div><div class="kb-k">t</div><div class="kb-k">y</div>
        <div class="kb-k">u</div><div class="kb-k">i</div><div class="kb-k">o</div>
        <div class="kb-k">p</div>
      </div>
      <div class="kb-row" style="padding: 0 18px;">
        <div class="kb-k">a</div><div class="kb-k">s</div><div class="kb-k">d</div>
        <div class="kb-k">f</div><div class="kb-k">g</div><div class="kb-k">h</div>
        <div class="kb-k">j</div><div class="kb-k">k</div><div class="kb-k">l</div>
      </div>
      <div class="kb-row">
        <div class="kb-k sp sp-shf">⇧</div>
        <div class="kb-k">z</div><div class="kb-k">x</div><div class="kb-k">c</div>
        <div class="kb-k">v</div><div class="kb-k">b</div><div class="kb-k">n</div>
        <div class="kb-k">m</div>
        <div class="kb-k sp sp-del">⌫</div>
      </div>
      <div class="kb-row">

    }

    const row = document.createElement('div');
    row.className = `msg-row ${item.side}`;

    const av = makeAvatar(item.side);
    let bubble;

    if (item.type === 'text') {
      bubble = document.createElement('div');
      bubble.className = 'bubble-text';
      // 支持 \n 换行，同时转义 HTML 防 XSS
      const escaped = item.text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\n/g, '<br>');
      bubble.innerHTML = escaped.replace(
        /(https?:\/\/[^\s<&，。！？、；：""''（）【】　]+|www\.[^\s<&，。！？、；：""''（）【】　]+)/g,
        u => {
          const href = u.startsWith('http') ? u : 'https://' + u;
          return `<a href="#" onclick="openPhoneWebview('${href}');return false;">${u}</a>`;
        }
      );
    }

    else if (item.type === 'voice') {
      bubble = document.createElement('div');
      bubble.className = 'bubble-voice';
      const waves = document.createElement('div');
      waves.className = 'voice-waves';
      waves.innerHTML = '<span></span><span></span><span></span>';
      const dur = document.createElement('span');
      dur.className = 'voice-dur';
      dur.textContent = `${item.seconds}″`;
      bubble.appendChild(waves);
      bubble.appendChild(dur);
    }

    else if (item.type === 'video') {
      bubble = document.createElement('div');
      bubble.className = 'bubble-video';
      const vid = document.createElement('video');
      vid.src = item.video.src || '';
      vid.preload = 'metadata';
      vid.muted = true;
      vid.playsInline = true;
      vid.addEventListener('loadedmetadata', () => { vid.currentTime = 0.5; });
      bubble.appendChild(vid);
      bubble.insertAdjacentHTML('beforeend', `
        <div class="vplay"><img src="播放.svg" alt="play"></div>
        <div class="vdur">${item.video.duration}</div>`);
      if (item.video.src) {
        bubble.addEventListener('click', () => openVideoModal(item.video.src));
      }
    }

    /* KEY FIX: append [av, bubble] for both sides.
       recv (row): av LEFT, bubble RIGHT.
       sent (row-reverse): av becomes rightmost, bubble to its left. */
    row.appendChild(av);
    row.appendChild(bubble);
    return row;
  }

  /* ── Sending indicator ── */
  function addSendingIndicator(side) {
    const row = document.createElement('div');
    row.className = `msg-row ${side} visible`;
    row.id = 'sending-indicator';
    const av = document.createElement('div');
    av.className = 'avatar';
    av.style.visibility = 'hidden';
    const dot = document.createElement('div');
    dot.className = 'sending-dot';
    dot.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(av);
    row.appendChild(dot);
    container.appendChild(row);
    scrollBottom();
  }

  function removeSendingIndicator() {
    const el = document.getElementById('sending-indicator');
    if (el) el.remove();
  }

  function scrollBottom() { container.scrollTop = container.scrollHeight; }

  /* ── Message display ── */
  function showMessage(item, cb) {
    if (item.type === 'annotation') {
      pendingAnnotation = item.text;
      setTimeout(cb, 50);
      return;
    }
    if (item.type === 'timestamp') {
      container.appendChild(makeBubble(item));
      scrollBottom();
      setTimeout(cb, 200);
      return;
    }
    const gen = generation;
    addSendingIndicator(item.side);
    setTimeout(() => {
      if (generation !== gen) { removeSendingIndicator(); cb(); return; }
      removeSendingIndicator();
      const row = makeBubble(item);
      container.appendChild(row);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        row.classList.add('visible');
        if (pendingAnnotation) {
          createFloatingAnnotation(pendingAnnotation, row);
          pendingAnnotation = null;
        } else {
          updateAnnotationPositions();
        }
      }));
      scrollBottom();
      setTimeout(cb, 400);
    }, item.type === 'text' ? 800 : 1100);
  }

  /* ── Playback controls ── */
  function stepForward() {
    if (currentIndex >= script.length) return;
    showMessage(script[currentIndex++], () => {});
    updateProgress();
  }

  function playAll() {
    if (isPlaying) {
      clearTimeout(playTimer);
      isPlaying = false;
      return;
    }
    if (currentIndex >= script.length) resetDemo();
    isPlaying = true;
    playNext();
  }

  function playNext() {
    if (!isPlaying || currentIndex >= script.length) {
      isPlaying = false;
      // playback finished — deselect scene card, leave messages intact
      document.querySelectorAll('.scene-card').forEach(c => c.classList.remove('active'));
      return;
    }
    const item = script[currentIndex++];
    showMessage(item, () => {
      if (!isPlaying) return;
      playTimer = setTimeout(playNext, item.type === 'timestamp' ? 200 : 600 + Math.random() * 400);
    });
  }

  function resetDemo() {
    generation++;
    clearTimeout(playTimer);
    isPlaying = false;
    currentIndex = 0;
    container.querySelectorAll('.msg-row, .ts-wrap, .ann-wrap').forEach(r => r.remove());
    clearAnnotations();
  }

  function switchScene(idx) {
    closePhoneVideo();
    closePhoneWebview();
    activeScene = idx;
    script = allScripts[idx];
    resetDemo();
    document.querySelectorAll('.scene-card').forEach((card, i) => {
      card.classList.toggle('active', i === idx);
    });
    playAll();
  }

  /* ── Textarea auto-resize ── */
  function resizeTextarea() {
    inputField.style.height = 'auto';
    inputField.style.height = Math.min(inputField.scrollHeight, 132) + 'px';
  }

  inputField.addEventListener('input', () => { resizeTextarea(); scrollBottom(); });

  inputField.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const text = inputField.value.trim();
      if (!text) return;
      const row = makeBubble({ side: 'sent', type: 'text', text });
      container.appendChild(row);
      requestAnimationFrame(() => requestAnimationFrame(() => row.classList.add('visible')));
      scrollBottom();
      inputField.value = '';
      resizeTextarea();
    }
  });

  /* ── Keyboard simulation toggle ── */
  inputField.addEventListener('focus', () => { phone.classList.add('keyboard-open'); scrollBottom(); });
  inputField.addEventListener('blur',  () => { phone.classList.remove('keyboard-open'); });

  /* ── In-phone video player ── */
  const phoneVideoPlayer = document.getElementById('phoneVideoPlayer');
  const phoneVideo       = document.getElementById('phoneVideo');
  const pvpPlayBtn       = document.getElementById('pvpPlayBtn');
  const pvpSeek          = document.getElementById('pvpSeek');
  const pvpTime          = document.getElementById('pvpTime');
  const pvpMuteBtn       = document.getElementById('pvpMuteBtn');
  const phoneWrapper     = document.getElementById('phoneWrapper');

  function fmtTime(s) {
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  phoneVideo.addEventListener('timeupdate', () => {
    if (!phoneVideo.duration) return;
    pvpSeek.value = (phoneVideo.currentTime / phoneVideo.duration) * 100;
    pvpTime.textContent = fmtTime(phoneVideo.currentTime);
  });
  phoneVideo.addEventListener('loadedmetadata', () => { pvpSeek.value = 0; pvpTime.textContent = '0:00'; });
  pvpPlayBtn.addEventListener('click', () => {
    if (phoneVideo.paused) {
      phoneVideo.play();
      document.getElementById('pvpIconPlay').style.display = 'none';
      document.getElementById('pvpIconPause').style.display = '';
    } else {
      phoneVideo.pause();
      document.getElementById('pvpIconPlay').style.display = '';
      document.getElementById('pvpIconPause').style.display = 'none';
    }
  });
  pvpSeek.addEventListener('input', () => {
    phoneVideo.currentTime = (pvpSeek.value / 100) * phoneVideo.duration;
  });
  function updateMuteIcon() {
    document.getElementById('pvpIconSound').style.display = phoneVideo.muted ? 'none' : '';
    document.getElementById('pvpIconMute').style.display  = phoneVideo.muted ? '' : 'none';
  }
  pvpMuteBtn.addEventListener('click', () => {
    phoneVideo.muted = !phoneVideo.muted;
    updateMuteIcon();
  });

  function openVideoModal(src) {
    phoneVideo.src = src;
    document.getElementById('pvpIconPlay').style.display = 'none';
    document.getElementById('pvpIconPause').style.display = '';
    phoneVideo.muted = false;
    updateMuteIcon();
    phoneVideoPlayer.classList.add('open');
    phoneWrapper.classList.add('video-playing');
    phoneVideo.play().catch(() => {});
  }

  function closePhoneVideo() {
    phoneVideo.pause();
    phoneVideo.src = '';
    phoneVideoPlayer.classList.remove('open');
    phoneWrapper.classList.remove('video-playing');
    document.getElementById('pvpIconPlay').style.display = '';
    document.getElementById('pvpIconPause').style.display = 'none';
  }

  phoneVideo.addEventListener('ended', closePhoneVideo);

  /* ── In-phone webview ── */
  const phoneWebview = document.getElementById('phoneWebview');
  const pwvFrame     = document.getElementById('pwvFrame');
  const pwvDomain    = document.getElementById('pwvDomain');

  const webviewTitles = {
    'https://xpad.xueersi.com/touch/?source_id=61': '学而思学习机官方商城',
    'https://playground.xes1v1.cn/math-mobile/?language=cn': '九章大模型',
  };

  function openPhoneWebview(url) {
    const title = webviewTitles[url] || '学而思网校';
    pwvTitle.textContent = title;
    try { pwvDomain.textContent = new URL(url).hostname; } catch(e) { pwvDomain.textContent = url; }
    pwvFrame.src = url;
    phoneWebview.classList.add('open');
    phoneWrapper.classList.add('video-playing');
  }

  function closePhoneWebview() {
    phoneWebview.classList.remove('open');
    pwvFrame.src = '';
    phoneWrapper.classList.remove('video-playing');
  }

  updateProgress();

</script>
</body>
</html>
