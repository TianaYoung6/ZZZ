<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ai Skill</title>
  <style>
    @font-face {
      font-family: 'FZHanZhenGuangBiaoS-GB';
      src: url('FZHZGBJW.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      background: #01020d;
      color: #fff;
      font-family: 'PingFang SC', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    /* ── PANE (tab content switch) ── */
    .pane {
      position: relative;
    }

    .pane[hidden] {
      display: none;
    }

    /* ── STICKY HEADER (shared) ── */
    #sticky-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: clamp(48px, 5vw, 80px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(12px, 2.5vw, 40px);
      padding: 0 clamp(16px, 3.75vw, 60px);
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.88) 0%, rgba(0, 0, 0, 0) 100%);
      z-index: 1000;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity .35s ease, transform .35s ease;
      pointer-events: none;
    }

    #sticky-header.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    .nav-title {
      display: flex;
      align-items: center;
      gap: clamp(12px, 2.5vw, 40px);
      flex-shrink: 1;
      min-width: 0;
      overflow: hidden;
    }

    .nav-title span {
      font-family: 'FZHanZhenGuangBiaoS-GB', 'STZhongsong', 'Noto Serif SC', serif;
      font-size: clamp(22px, 3.75vw, 60px);
      font-weight: normal;
      color: #ddeaff;
      line-height: 1.2;
    }

    .nav-title .nav-title-name {
      letter-spacing: clamp(2px, .375vw, 6px);
    }

    #sticky-header .nav-title span {
      font-size: clamp(13px, 2.0625vw, 33px);
    }

    .tabs-row {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1.5vw, 24px);
      flex-shrink: 0;
      flex-wrap: nowrap;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: clamp(5px, .75vw, 12px) clamp(10px, 1.5vw, 24px);
      border-radius: 9999px;
      border: 1.2px solid rgba(221, 234, 255, .85);
      background: rgba(255, 255, 255, .10);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #fff;
      font-family: 'PingFang SC', -apple-system, sans-serif;
      font-size: clamp(10px, 1.5vw, 24px);
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      opacity: .9;
      transition: background .22s ease, opacity .22s ease, transform .12s ease;
      -webkit-appearance: none;
      appearance: none;
      user-select: none;
    }

    .tab-btn.active {
      background: linear-gradient(90deg, #3c91ff 0%, #619de6 38%, #7684ea 76%, #3c91ff 100%);
      opacity: .9;
    }

    .tab-btn:hover {
      opacity: 1;
      transform: scale(1.03);
    }

    .tab-btn:active {
      transform: scale(.97);
    }

    /* ── HERO (shared) ── */
    .section-hero {
      position: relative;
      width: 100%;
      z-index: 1;
    }

    .section-hero .bg {
      width: 100%;
      display: block;
    }

    .nav-overlay {
      position: absolute;
      top: calc(60 / 800 * 100%);
      left: 0;
      right: 0;
      height: calc(200 / 800 * 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 2.5vw, 40px);
      padding: 0 clamp(16px, 3.75vw, 60px);
    }

    .section-img {
      width: 100%;
      display: block;
    }

    /* ── Vibe Coding: logos overlay on hero ── */
    .logos-overlay {
      position: absolute;
      top: calc(740 / 800 * 100%);
      left: calc(65 / 1600 * 100%);
      display: flex;
      align-items: center;
      gap: clamp(12px, 2.5vw, 40px);
      z-index: 2;
    }

    .logos-overlay img {
      width: clamp(32px, calc(120 / 1600 * 100vw), 120px);
      height: clamp(32px, calc(120 / 1600 * 100vw), 120px);
      object-fit: contain;
      border-radius: 50%;
    }

    .section-gap {
      background: #01020d;
      height: calc(80 / 1600 * 100vw);
    }

    /* ── Vibe Coding: VibeCoding2 + H5 iframe ── */
    .vc-section-2 {
      position: relative;
      width: 100%;
    }

    .vc-section-2 .bg {
      width: 100%;
      display: block;
    }

    .h5-container {
      position: absolute;
      top: calc(168 / 880 * 100%);
      left: calc(1100 / 1600 * 100%);
      width: calc(517 / 1600 * 100%);
      height: calc(720 / 880 * 100%);
      border-radius: clamp(8px, 2.5vw, 40px) 0 0 0;
      overflow: hidden;
      border: 2px solid #fff;
      background: #0d0d1a;
    }

    .h5-container iframe {
      border: none;
      display: block;
    }

    /* ── dark blur band ── */
    .section-blur-band {
      height: calc(100 / 1600 * 100vw);
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(17.5px);
      -webkit-backdrop-filter: blur(17.5px);
    }

    .vc-wrap {
      position: relative;
      width: 100%;
    }

    .vc-wrap .bg {
      width: 100%;
      display: block;
    }

    /* ── VC3 overlays: handwriting + pen ── */
    .handwriting {
      position: absolute;
      top: calc(536 / 1182 * 100%);
      left: calc(828 / 1600 * 100%);
      width: calc(360 / 1600 * 100%);
      height: auto;
      object-fit: contain;
      clip-path: inset(0 100% 0 0);
    }

    .handwriting .hw-text {
      font-family: 'FZHanZhenGuangBiaoS-GB', 'STZhongsong', serif;
      font-size: clamp(14px, calc(21 / 1600 * 100vw), 21px);
      color: #fff;
      line-height: 1.1;
      white-space: nowrap;
      letter-spacing: .02em;
    }

    .hand-pen {
      position: absolute;
      top: calc(330 / 1182 * 100%);
      left: calc(1077 / 1600 * 100%);
      width: calc(732 / 1600 * 100%);
      height: calc(680 / 1182 * 100%);
      object-fit: contain;
      transform: translateX(-30%);
    }

    /* ── VC4 overlay: 难点讨论 card ── */
    .discuss-card {
      position: absolute;
      top: calc(625 / 1374 * 100%);
      left: calc(903 / 1600 * 100%);
      width: calc(600 / 1600 * 100%);
      height: calc(749 / 1374 * 100%);
    }

    .discuss-card .discuss-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .discuss-list {
      position: absolute;
      top: 14%;
      left: 6%;
      right: 6%;
      bottom: 6%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: calc(34 / 749 * 100%);
      z-index: 2;
    }

    .discuss-row {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0;
      transform: translateY(20px);
    }

    .discuss-row.revealed {
      opacity: 1;
      transform: none;
      transition: opacity .5s ease, transform .5s ease;
    }

    .discuss-divider {
      width: 100%;
      height: 1px;
      margin: calc(34 / 749 * 100%) 0;
      background: linear-gradient(90deg, #000, #fff 50%, #000);
      opacity: 0;
      transform: scaleX(0);
      transform-origin: left;
    }

    .discuss-divider.revealed {
      opacity: 1;
      transform: none;
      transition: opacity .5s ease, transform .5s ease;
    }

    /* ── VC standalone zV5Jg + flow row ── */
    .standalone-img {
      display: block;
    }

    .flow-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(24 / 1600 * 100vw);
      padding: calc(40 / 1600 * 100vw) calc(52 / 1600 * 100%);
      background: #01020d;
    }

    .flow-item {
      height: calc(102 / 1600 * 100vw);
      width: auto;
      display: block;
      opacity: 0;
      transform: translateX(20px);
    }

    .flow-item.revealed {
      opacity: 1;
      transform: none;
      transition: opacity .7s ease, transform .7s ease;
    }

    .flow-arrow {
      flex: 0 0 auto;
      width: calc(20 / 1600 * 100%);
      height: 2px;
      background: #ddeaff;
      position: relative;
      opacity: 0;
      transition: opacity .4s ease;
    }

    .flow-arrow.revealed {
      opacity: 1;
    }

    .flow-arrow::after {
      content: '';
      position: absolute;
      right: -1px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-top: 2px solid #ddeaff;
      border-right: 2px solid #ddeaff;
      transform: translateY(-50%) rotate(45deg);
    }

    @keyframes writeReveal {
      0% {
        clip-path: inset(0 100% 0 0);
      }

      100% {
        clip-path: inset(0 0 0 0);
      }
    }

    @keyframes penMove {
      0% {
        transform: translateX(-30%);
      }

      100% {
        transform: translateX(0%);
      }
    }

    .handwriting.writing {
      animation: writeReveal 2.4s cubic-bezier(.45, 0, .55, 1) forwards;
    }

    .hand-pen.writing {
      animation: penMove 2.4s cubic-bezier(.45, 0, .55, 1) forwards;
    }

    /* ── Ai内容生产: logos row + 4-image groups ── */
    .logos-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: calc(40 / 1600 * 100vw);
      margin-top: calc(81 / 1600 * 100vw);
    }

    .logos-row img {
      width: calc(120 / 1600 * 100vw);
      height: calc(120 / 1600 * 100vw);
      object-fit: contain;
      border-radius: 50%;
    }

    .four-img-group {
      position: relative;
      width: calc(1480 / 1600 * 100%);
      margin-left: auto;
      margin-right: auto;
    }

    #nr-group3 {
      aspect-ratio: 1480 / 697;
    }

    #nr-group6 {
      aspect-ratio: 1480 / 697.5;
    }

    .four-img-group .fi {
      position: absolute;
      height: auto;
      object-fit: contain;
      opacity: 0;
      transform: translateX(-40px);
      transition: opacity .7s ease, transform .7s ease;
    }

    .four-img-group.revealed .fi {
      opacity: 1;
      transform: none;
    }

    .four-img-group.revealed .fi:nth-child(1) {
      transition-delay: 0s;
    }

    .four-img-group.revealed .fi:nth-child(2) {
      transition-delay: .22s;
    }

    .four-img-group.revealed .fi:nth-child(3) {
      transition-delay: .44s;
    }

    .four-img-group.revealed .fi:nth-child(4) {
      transition-delay: .66s;
    }

    #nr-group3 .fi-1 {
      left: 0%;
      top: 11.45%;
      width: 24.49%;
    }

    #nr-group3 .fi-2 {
      left: 25.46%;
      top: 0%;
      width: 24.56%;
    }

    #nr-group3 .fi-3 {
      left: 50.86%;
      top: 7.26%;
      width: 24.56%;
    }

    #nr-group3 .fi-4 {
      left: 76.25%;
      top: 16.76%;
      width: 23.75%;
    }

    #nr-group6 .fi-1 {
      left: 0%;
      top: 0%;
      width: 24.56%;
    }

    #nr-group6 .fi-2 {
      left: 25.41%;
      top: 8.66%;
      width: 24.56%;
    }

    #nr-group6 .fi-3 {
      left: 50.82%;
      top: 6.70%;
      width: 24.49%;
    }

    #nr-group6 .fi-4 {
      left: 76.23%;
      top: 1.40%;
      width: 23.78%;
    }

    /* ── VIDEO PLAYER area (shared by Ai内容生产 + Ai项目&赛事) ── */
    .video-area {
      position: relative;
      width: calc(1100 / 1600 * 100%);
      margin-left: auto;
      margin-right: auto;
      aspect-ratio: 1100 / 619;
      background: #d9d9d9;
      overflow: hidden;
    }

    .video-area.r16 {
      aspect-ratio: 1100 / 687.5;
    }

    .video-area video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-area .mute-btn {
      position: absolute;
      right: clamp(8px, 1vw, 16px);
      bottom: clamp(8px, 1vw, 16px);
      width: clamp(30px, 2.2vw, 42px);
      height: clamp(30px, 2.2vw, 42px);
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, .45);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: background .2s ease, transform .12s ease;
    }

    .video-area .mute-btn:hover {
      background: rgba(0, 0, 0, .65);
    }

    .video-area .mute-btn:active {
      transform: scale(.92);
    }

    .video-area .mute-btn img,
    .video-area .mute-btn svg {
      width: 62%;
      height: 62%;
      object-fit: contain;
    }

    .video-area .mute-btn .icon-unmuted {
      display: none;
    }

    .video-area.unmuted .mute-btn .icon-muted {
      display: none;
    }

    .video-area.unmuted .mute-btn .icon-unmuted {
      display: inline-block;
    }

    /* ── Ai赛事自驱 (旧版上半部分) ── */
    .race-hero-bg {
      width: 100%;
      aspect-ratio: 1600 / 800;
      background: #080818;
    }

    .race-s2 {
      width: 100%;
    }

    /* laptop mockup + video overlay — all % relative to image width */
    .race-laptop-wrap {
      position: relative;
      width: 100%;
    }

    .race-laptop-frame {
      width: 100%;
      height: auto;
      display: block;
    }

    .race-laptop-screen {
      position: absolute;
      top: 19.5%;
      left: 7.5%;
      width: 43.125%;
      aspect-ratio: 16/10;
      overflow: hidden;
    }

    .race-laptop-screen video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .race-laptop-screen video::-webkit-media-controls-fullscreen-button,
    .race-laptop-screen video::-webkit-media-controls-overflow-button {
      display: none !important;
    }

    .race-pl {
      width: 100%;
      background: #06060f;
    }

    .race-wechat {
      width: 100%;
      position: relative;
      overflow: hidden;
      background: #111;
    }

    .race-wechat iframe {
      position: absolute;
      top: 0;
      left: 0;
      border: none;
      display: block;
      transform-origin: top left;
    }

    /* ── 3D 卡片扇形展示 ── */
    .race-fan-section {
      background: #fefefe;
      width: 100%;
      aspect-ratio: 1600/660;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .race-fan-stage {
      position: relative;
      width: 100%;
      height: 90%;
      perspective: 48vw;
      perspective-origin: 42% 48%;
    }

    .race-fan-deck {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform: rotateX(-15deg) rotateY(-20deg);
    }

    .race-fan-card {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 25vw;
      aspect-ratio: 1280/800;
      border-radius: 1vw;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        opacity 0.55s ease,
        box-shadow 0.5s ease;
    }

    .race-fan-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* ── 3.jpg + 圆形卡片叠层 ── */
    .race-s3-wrap {
      position: relative;
      width: 100%;
    }

    .race-cards-row {
      position: absolute;
      top: 52.54%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: calc(40 / 1600 * 100vw);
    }

    .race-card {
      position: relative;
      width: calc(260 / 1600 * 100vw);
      height: calc(260 / 1600 * 100vw);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid transparent;
      background-clip: padding-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(30 / 1600 * 100vw);
      box-sizing: border-box;
      gap: calc(7.2 / 1600 * 100vw);
      flex-shrink: 0;
      overflow: hidden;
    }

    .race-card::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 1), rgba(255, 255, 255, 0.2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
    }

    .race-card-title {
      font-family: 'PingFang SC', -apple-system, sans-serif;
      font-size: calc(27 / 1600 * 100vw);
      color: #f4d198;
      font-weight: normal;
      line-height: 1.2;
      text-align: center;
      margin: 0;
    }

    .race-card-desc {
      font-family: 'PingFang SC', -apple-system, sans-serif;
      font-size: calc(20 / 1600 * 100vw);
      color: #fdfcf8;
      letter-spacing: 0.1em;
      line-height: 1.5;
      text-align: center;
      margin: 0;
    }

    /* ── Ai项目&赛事: design-matched layout ── */
    .ri {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity .7s ease, transform .7s ease;
    }

    .revealed>.ri {
      opacity: 1;
      transform: none;
    }

    .revealed>.ri:nth-child(1) { transition-delay: 0s; }
    .revealed>.ri:nth-child(2) { transition-delay: .16s; }
    .revealed>.ri:nth-child(3) { transition-delay: .32s; }
    .revealed>.ri:nth-child(4) { transition-delay: .48s; }

    .ap-title {
      font-family: 'FZHanZhenGuangBiaoS-GB', serif;
      font-size: calc(40 / 1600 * 100vw);
      line-height: 1.2;
      letter-spacing: calc(4 / 1600 * 100vw);
      text-align: center;
      color: #fff;
    }
    .ap-title.dde { color: #ddeaff; }

    .ap-caption {
      font-family: 'Poppins', 'PingFang SC', sans-serif;
      font-style: italic;
      font-weight: 600;
      font-size: calc(30 / 1600 * 100vw);
      color: #fcb356;
      text-align: center;
      line-height: 1.2;
    }

    /* numhead: 183-tall box, 3 centered rows at y0/73/152 (design overlap) */
    .ap-numhead {
      position: relative;
      width: 100%;
      height: calc(183 / 1600 * 100vw);
      line-height: 1.2;
    }
    .ap-numhead .num {
      position: absolute;
      top: 0; left: 0; right: 0;
      text-align: center;
      font-family: 'FZHanZhenGuangBiaoS-GB', serif;
      font-size: calc(100 / 1600 * 100vw);
      color: rgba(221, 234, 255, .2);
      line-height: 1.1;
    }
    .ap-numhead .h {
      position: absolute;
      top: calc(73 / 1600 * 100vw);
      left: 0; right: 0;
      text-align: center;
      font-family: 'FZHanZhenGuangBiaoS-GB', serif;
      font-size: calc(40 / 1600 * 100vw);
      color: #ddeaff;
      letter-spacing: calc(4 / 1600 * 100vw);
    }
    .ap-numhead .sub {
      position: absolute;
      top: calc(152 / 1600 * 100vw);
      left: 0; right: 0;
      text-align: center;
      font-family: 'PingFang SC', sans-serif;
      font-weight: 500;
      font-size: calc(26 / 1600 * 100vw);
      color: rgba(221, 234, 255, .8);
      letter-spacing: calc(2.6 / 1600 * 100vw);
    }

    /* ss-电脑 (left, 584) + hackathon card (right); section height driven by .pc */
    .ap-hackathon {
      display: flex;
      gap: calc(60 / 1600 * 100vw);
      align-items: flex-start;
    }
    .ap-hackathon .pc {
      width: calc(900 / 1600 * 100%);
      flex: 0 0 auto;
      height: calc(584 / 1600 * 100vw);
      object-fit: cover;
      object-position: top;
    }
    .ap-hackathon .card {
      width: calc(640 / 1600 * 100%);
      margin-top: calc(18 / 1600 * 100vw);
    }
    .ap-hackathon .card h3 {
      font-family: 'Source Han Sans CN', 'PingFang SC', sans-serif;
      font-weight: 700;
      font-size: calc(30 / 1600 * 100vw);
      color: #fff;
      letter-spacing: calc(3 / 1600 * 100vw);
      line-height: 1.2;
    }
    .ap-hackathon .card .logos {
      display: flex;
      gap: calc(32 / 1600 * 100vw);
      margin-top: calc(41 / 1600 * 100vw);
    }
    .ap-hackathon .card .logos img {
      width: calc(80 / 1600 * 100vw);
      height: calc(80 / 1600 * 100vw);
      object-fit: contain;
      border-radius: 50%;
    }
    .ap-hackathon .card .lede {
      font-family: 'PingFang SC', sans-serif;
      font-weight: 400;
      font-size: calc(24 / 1600 * 100vw);
      color: rgba(255, 255, 255, .8);
      line-height: 1;
      margin-top: calc(62 / 1600 * 100vw);
    }
    .ap-pills {
      display: flex;
      flex-direction: column;
      gap: calc(24 / 1600 * 100vw);
      margin-top: calc(48 / 1600 * 100vw);
    }
    .ap-pill {

  <script src="components/popup/popup.js"></script>
  <script>
    /* ── ss-6 → 家长端-Ai Agent popup ── */
    (function () {
      const trigger = document.getElementById('ap-ss6');
      if (!trigger) return;
      trigger.addEventListener('click', () => {
        Popup.open({
          title: '家长端-Ai Agent',
          content: '<img src="assets/Ai技能/Ai项目&amp;赛事/app弹窗.png" alt="家长端-Ai Agent" draggable="false">'
        });
      });
    })();

    /* ── TAB SWITCHING + HASH ── */
    const PANES = Array.from(document.querySelectorAll('.pane[data-pane]'));
    const TAB_BTNS = Array.from(document.querySelectorAll('.tab-btn[data-tab]'));

    function setActiveTab(tab, scrollToTop) {
      PANES.forEach(p => { p.hidden = (p.dataset.pane !== tab); });
      TAB_BTNS.forEach(b => {
        const on = b.dataset.tab === tab;
        b.classList.toggle('active', on);
        if (on) b.setAttribute('aria-current', 'page');
        else b.removeAttribute('aria-current');
      });
      if (scrollToTop) window.scrollTo({ top: 0, behavior: 'auto' });
      if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab);
      // re-run iframe sizing for the now-visible pane
      window.dispatchEvent(new Event('resize'));
    }

    TAB_BTNS.forEach(b => {
      b.addEventListener('click', () => setActiveTab(b.dataset.tab, true));
    });

    (function initFromHash() {
      const valid = new Set(['vibe-coding', 'ai-content', 'ai-project']);
      const h = location.hash.slice(1);
      setActiveTab(valid.has(h) ? h : 'vibe-coding', false);
    })();

    /* ── STICKY HEADER + BACK-TOP ── */
    const stickyHeader = document.getElementById('sticky-header');
    const backTop = document.getElementById('back-top');
    function navThreshold() { return window.innerWidth * (260 / 1600); }
    function onScroll() {
      const scrollY = window.scrollY;
      stickyHeader.classList.toggle('visible', scrollY > navThreshold());
      backTop.classList.toggle('visible', scrollY > window.innerHeight * 0.6);
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    /* ── GENERIC REVEAL: [data-reveal] + .four-img-group ── */
    (function () {
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const targets = Array.from(document.querySelectorAll('.four-img-group, [data-reveal]'));
      if (reduce || !('IntersectionObserver' in window)) {
        targets.forEach(t => t.classList.add('revealed'));
        return;
      }
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (!e.isIntersecting) return;
          e.target.classList.add('revealed');
          io.unobserve(e.target);
        });
      }, { threshold: 0.2 });
      targets.forEach(t => io.observe(t));
    })();

    /* ── IFRAME scale-to-fit (VC H5 + AP wechat) ── */
    function scaleIframe(containerId, iframeId, dw, dh) {
      const c = document.getElementById(containerId);
      const f = document.getElementById(iframeId);
      if (!c || !f) return;
      const cW = c.clientWidth, cH = c.clientHeight;
      if (cW === 0 || cH === 0) return;
      const scale = Math.min(cW / dw, cH / dh);
      const offX = (cW - dw * scale) / 2;
      const offY = (cH - dh * scale) / 2;
      f.style.width = dw + 'px';
      f.style.height = dh + 'px';
      f.style.transform = `translate(${offX}px, ${offY}px) scale(${scale})`;
      f.style.transformOrigin = 'top left';
    }
    function scaleAllIframes() {
      scaleIframe('vc-h5-container', 'vc-h5-iframe', 375, 812);
      scaleIframe('ap-wechat-container', 'ap-wechat-iframe', 940, 800);
    }
    const vcH5c = document.getElementById('vc-h5-container');
    if (window.ResizeObserver && vcH5c) new ResizeObserver(scaleAllIframes).observe(vcH5c);
    const apWc = document.getElementById('ap-wechat-container');
    if (window.ResizeObserver && apWc) new ResizeObserver(scaleAllIframes).observe(apWc);
    window.addEventListener('resize', scaleAllIframes, { passive: true });
    window.addEventListener('load', scaleAllIframes);

    /* ── VC: handwriting reveal (once) ── */
    (function () {
      const hw = document.getElementById('handwriting');
      const pen = document.getElementById('handPen');
      const vc3 = document.getElementById('vc3');
      if (!hw || !pen || !vc3) return;
      if (!('IntersectionObserver' in window) ||
        matchMedia('(prefers-reduced-motion: reduce)').matches) {
        hw.classList.add('writing'); pen.classList.add('writing'); return;
      }
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            hw.classList.add('writing');
            pen.classList.add('writing');
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0.35 });
      io.observe(vc3);
    })();

    /* ── VC: 难点讨论 list + zV5Jg + flow row ── */
    (function () {
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const reveal = (el) => el.classList.add('revealed');
      const rows = Array.from(document.querySelectorAll('#discussList .discuss-row, #discussList .discuss-divider'));
      const flowItems = Array.from(document.querySelectorAll('#flowRow .flow-item, #flowRow .flow-arrow'));
      const zv5 = document.getElementById('zv5jg');
      if (reduce) {
        rows.forEach(reveal); flowItems.forEach(reveal);
        if (zv5) zv5.style.opacity = '1';
        return;
      }
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (!e.isIntersecting) return;
          reveal(e.target);
          io.unobserve(e.target);
        });
      }, { threshold: 0.5 });
      rows.forEach((r) => io.observe(r));
      const flowRow = document.getElementById('flowRow');
      if (flowRow) {
        const fio = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (!e.isIntersecting) return;
            flowItems.forEach((f, i) => setTimeout(() => reveal(f), i * 150));
            fio.unobserve(e.target);
          });
        }, { threshold: 0.3 });
        fio.observe(flowRow);
      }
      if (zv5) {
        zv5.style.opacity = '0';
        zv5.style.transition = 'opacity .5s ease';
        const zio = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (!e.isIntersecting) return;
            zv5.style.opacity = '1';
            zio.unobserve(e.target);
          });
        }, { threshold: 0.4 });
        zio.observe(zv5);
      }
    })();

    /* ── VIDEO: auto-play in view + loop + mute toggle ── */
    function setupVideo(areaId, videoId, muteBtnId) {
      const video = document.getElementById(videoId);
      const area = document.getElementById(areaId);
      const muteBtn = document.getElementById(muteBtnId);
      if (!video || !area) return;
      if (!('IntersectionObserver' in window)) {
        video.play().catch(() => { });
      } else {
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              video.play().catch(() => { });
            } else {
              video.pause();
            }
          });
        }, { threshold: 0.45 });
        io.observe(area);
      }
      if (muteBtn) {
        const sync = () => {
          const on = !video.muted;
          area.classList.toggle('unmuted', on);
          muteBtn.setAttribute('aria-label', on ? '静音' : '开启声音');
          muteBtn.title = on ? '静音' : '开启声音';
        };
        muteBtn.addEventListener('click', () => {
          video.muted = !video.muted;
          sync();
        });
        video.addEventListener('volumechange', sync);
        sync();
      }
    }
    setupVideo('nr-videoArea', 'nr-vcVideo', 'nr-muteBtn');

    /* ── RACE WECHAT IFRAME · scale-to-fit (ResizeObserver so it rescales when pane becomes visible) ── */
    (function () {
      const RACE_W = 1100, RACE_H = 924;
      const raceSection = document.querySelector('.race-wechat');
      const raceFrame = raceSection && raceSection.querySelector('iframe');
      if (!raceSection || !raceFrame) return;
      function scaleRaceWechat() {
        const cw = raceSection.clientWidth;
        if (!cw) return;
        const scale = Math.min(1, cw / RACE_W);
        const offsetX = (cw - RACE_W * scale) / 2;
        raceFrame.style.width = RACE_W + 'px';
        raceFrame.style.height = RACE_H + 'px';
        raceFrame.style.transformOrigin = 'top left';
        raceFrame.style.transform = `translateX(${offsetX}px) scale(${scale})`;
        raceSection.style.height = Math.ceil(RACE_H * scale) + 'px';
      }
      if (window.ResizeObserver) new ResizeObserver(scaleRaceWechat).observe(raceSection);
      window.addEventListener('resize', scaleRaceWechat, { passive: true });
      scaleRaceWechat();
    })();

    /* ── 苹果风格斜向纵深轮播 (race fan deck) ── */
    (function () {
      const deck = document.getElementById('raceFanDeck');
      if (!deck) return;
      const cards = Array.from(deck.querySelectorAll('.race-fan-card'));
      const N = cards.length;
      const SHOW = 6;
      const DX = 3.8;
      const DY = 2.8;
      const DZ = 5.0;
      const CW = 25;
      const CH = CW * 800 / 1280;
      const OX = -((SHOW - 1) * DX) / 2;
      const OY = ((SHOW - 1) * DY) / 2;
      let frontIdx = 0;
      let timer = null;
      function pos(i) { return (i - frontIdx + N) % N; }
      function applyPos(card, p, instant) {
        if (instant) card.style.transition = 'none';
        const visible = p < SHOW;
        card.style.opacity = visible ? String(1 - p * 0.07) : '0';
        card.style.pointerEvents = p === 0 ? 'auto' : 'none';
        card.style.zIndex = String(visible ? SHOW - p + 5 : 0);
        const px = OX + p * DX - CW / 2;
        const py = OY - p * DY - CH / 2;
        const pz = -p * DZ;
        const sh = p === 0
          ? '0 1.2vw 3.5vw rgba(0,0,0,0.45)'
          : `0 0.4vw ${0.8 + p * 0.3}vw rgba(0,0,0,0.25)`;
        card.style.transform = `translateX(${px}vw) translateY(${py}vw) translateZ(${pz}vw)`;
        card.style.boxShadow = sh;
        if (instant) requestAnimationFrame(() =>
          requestAnimationFrame(() => { card.style.transition = ''; })
        );
      }
      function renderAll() { cards.forEach((c, i) => applyPos(c, pos(i), false)); }
      function advance() {
        const old = cards[frontIdx];
        frontIdx = (frontIdx + 1) % N;
        applyPos(old, SHOW, true);
        requestAnimationFrame(() =>
          requestAnimationFrame(() => renderAll())
        );
      }
      function startAuto() { timer = setInterval(advance, 3200); }
      function stopAuto() { clearInterval(timer); timer = null; }
      cards.forEach((c, i) => applyPos(c, i, true));
      deck.addEventListener('click', () => { advance(); stopAuto(); startAuto(); });
      deck.addEventListener('mouseenter', stopAuto);
      deck.addEventListener('mouseleave', startAuto);
      startAuto();
    })();
  </script>
