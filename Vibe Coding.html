<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Coding</title>
  <style>
    @font-face {
      font-family: 'FZHanZhenGuangBiaoS-GB';
      src: url('FZHZGBJW.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      background: #01020d;
      color: #fff;
      font-family: 'PingFang SC', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      overflow-x: hidden;
    }

    /* ── STICKY HEADER ── */
    #sticky-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: clamp(48px, 5vw, 80px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(12px, 2.5vw, 40px);
      padding: 0 clamp(16px, 3.75vw, 60px);
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.88) 0%, rgba(0, 0, 0, 0) 100%);
      z-index: 1000;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity .35s ease, transform .35s ease;
      pointer-events: none;
    }

    #sticky-header.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    .nav-title {
      display: flex;
      align-items: center;
      gap: clamp(12px, 2.5vw, 40px);
      flex-shrink: 1;
      min-width: 0;
      overflow: hidden;
    }

    .nav-title span {
      font-family: 'FZHanZhenGuangBiaoS-GB', 'STZhongsong', 'Noto Serif SC', serif;
      font-size: clamp(22px, 3.75vw, 60px);
      font-weight: normal;
      color: #ddeaff;
      line-height: 1.2;
    }

    .nav-title .nav-title-name {
      letter-spacing: clamp(2px, .375vw, 6px);
    }

    #sticky-header .nav-title span {
      font-size: clamp(13px, 2.0625vw, 33px);
    }

    .tabs-row {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1.5vw, 24px);
      flex-shrink: 0;
      flex-wrap: nowrap;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: clamp(5px, .75vw, 12px) clamp(10px, 1.5vw, 24px);
      border-radius: 9999px;
      border: 1.2px solid rgba(221, 234, 255, .85);
      background: rgba(255, 255, 255, .10);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #fff;
      font-family: 'PingFang SC', -apple-system, sans-serif;
      font-size: clamp(10px, 1.5vw, 24px);
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      opacity: .9;
      transition: background .22s ease, opacity .22s ease, transform .12s ease;
      -webkit-appearance: none;
      appearance: none;
      user-select: none;
    }

    .tab-btn.active {
      background: linear-gradient(90deg, #3c91ff 0%, #619de6 38%, #7684ea 76%, #3c91ff 100%);
      opacity: .9;
    }

    .tab-btn:hover {
      opacity: 1;
      transform: scale(1.03);
    }

    .tab-btn:active {
      transform: scale(.97);
    }

    /* ── HERO (VibeCoding1) ── */
    .section-hero {
      position: relative;
      width: 100%;
      z-index: 1;
    }

    .section-hero .bg {
      width: 100%;
      display: block;
    }

    .nav-overlay {
      position: absolute;
      top: calc(60 / 800 * 100%);
      left: 0;
      right: 0;
      height: calc(200 / 800 * 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 2.5vw, 40px);
      padding: 0 clamp(16px, 3.75vw, 60px);
    }

    .logos-overlay {
      position: absolute;
      top: calc(740 / 800 * 100%);
      left: calc(65 / 1600 * 100%);
      display: flex;
      align-items: center;
      gap: clamp(12px, 2.5vw, 40px);
      z-index: 2;
    }

    .logos-overlay img {
      width: clamp(32px, calc(120 / 1600 * 100vw), 120px);
      height: clamp(32px, calc(120 / 1600 * 100vw), 120px);
      object-fit: contain;
      border-radius: 50%;
    }

    .section-gap {
      background: #01020d;
      height: calc(80 / 1600 * 100vw);
    }

    /* ── VibeCoding2 + H5 iframe ── */
    .section-2 {
      position: relative;
      width: 100%;
    }

    .section-2 .bg {
      width: 100%;
      display: block;
    }

    .h5-container {
      position: absolute;
      top: calc(168 / 880 * 100%);
      left: calc(1100 / 1600 * 100%);
      width: calc(517 / 1600 * 100%);
      height: calc(720 / 880 * 100%);
      border-radius: clamp(8px, 2.5vw, 40px) 0 0 0;
      overflow: hidden;
      border: 2px solid #fff;
      background: #0d0d1a;
    }

    .h5-container iframe {
      border: none;
      display: block;
    }

    /* ── dark blur band (ILaWu, 400px) — replaces old 100px fade ── */
    .section-blur-band {
      height: calc(100 / 1600 * 100vw);
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(17.5px);
      -webkit-backdrop-filter: blur(17.5px);
    }

    .section-img {
      width: 100%;
      display: block;
    }

    .vc-wrap {
      position: relative;
      width: 100%;
    }

    .vc-wrap .bg {
      width: 100%;
      display: block;
    }

    /* ── VC3 overlays: handwriting + pen ── */
    .handwriting {
      position: absolute;
      top: calc(536 / 1182 * 100%);
      left: calc(828 / 1600 * 100%);
      width: calc(360 / 1600 * 100%);
      height: auto;
      object-fit: contain;
      clip-path: inset(0 100% 0 0);
    }

    .handwriting .hw-text {
      font-family: 'FZHanZhenGuangBiaoS-GB', 'STZhongsong', serif;
      font-size: clamp(14px, calc(21 / 1600 * 100vw), 21px);
      color: #fff;
      line-height: 1.1;
      white-space: nowrap;
      letter-spacing: .02em;
    }

    .hand-pen {
      position: absolute;
      top: calc(330 / 1182 * 100%);
      left: calc(1077 / 1600 * 100%);
      width: calc(732 / 1600 * 100%);
      height: calc(680 / 1182 * 100%);
      object-fit: contain;
      transform: translateX(-30%);
    }

    /* ── VC4 overlay: 难点讨论 card ── */
    .discuss-card {
      position: absolute;
      top: calc(625 / 1374 * 100%);
      left: calc(903 / 1600 * 100%);
      width: calc(600 / 1600 * 100%);
      height: calc(749 / 1374 * 100%);
    }

    .discuss-card .discuss-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    .discuss-list {
      position: absolute;
      top: 14%;
      left: 6%;
      right: 6%;
      bottom: 6%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: calc(34 / 749 * 100%);
      z-index: 2;
    }

    .discuss-row {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0;
      transform: translateY(20px);
    }

    .discuss-row.revealed {
      opacity: 1;
      transform: none;
      transition: opacity .5s ease, transform .5s ease;
    }

    .discuss-divider {
      width: 100%;
      height: 1px;
      margin: calc(34 / 749 * 100%) 0;
      background: linear-gradient(90deg, #000, #fff 50%, #000);
      opacity: 0;
      transform: scaleX(0);
      transform-origin: left;
    }

    .discuss-divider.revealed {
      opacity: 1;
      transform: none;
      transition: opacity .5s ease, transform .5s ease;
    }

    /* ── standalone zV5Jg + flow row ── */
    .standalone-img {
      display: block;
    }

    .flow-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(24 / 1600 * 100vw);
      padding: calc(40 / 1600 * 100vw) calc(52 / 1600 * 100%);
      background: #01020d;
    }

    .flow-item {
      height: calc(102 / 1600 * 100vw);
      width: auto;
      display: block;
      opacity: 0;
      transform: translateX(20px);
    }

    .flow-item.revealed {
      opacity: 1;
      transform: none;
      transition: opacity .7s ease, transform .7s ease;
    }

    .flow-arrow {
      flex: 0 0 auto;
      width: calc(20 / 1600 * 100%);
      height: 2px;
      background: #ddeaff;
      position: relative;
      opacity: 0;
      transition: opacity .4s ease;
    }

    .flow-arrow.revealed {
      opacity: 1;
    }

    .flow-arrow::after {
      content: '';
      position: absolute;
      right: -1px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-top: 2px solid #ddeaff;
      border-right: 2px solid #ddeaff;
      transform: translateY(-50%) rotate(45deg);
    }

    /* ── handwriting animation ── */
    @keyframes writeReveal {
      0% {
        clip-path: inset(0 100% 0 0);
      }

      100% {
        clip-path: inset(0 0 0 0);
      }
    }

    @keyframes penMove {
      0% {
        transform: translateX(-30%);
      }

      100% {
        transform: translateX(0%);
      }
    }

    .handwriting.writing {
      animation: writeReveal 2.4s cubic-bezier(.45, 0, .55, 1) forwards;
    }

    .hand-pen.writing {
      animation: penMove 2.4s cubic-bezier(.45, 0, .55, 1) forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .handwriting {
        clip-path: inset(0 0 0 0);
        animation: none;
      }

      .hand-pen {
        transform: translateX(0);
        animation: none;
      }
    }

    /* ── back to top ── */
    #back-top {
      position: fixed;
      bottom: clamp(16px, 3vw, 40px);
      right: clamp(16px, 3vw, 40px);
      width: clamp(36px, 3vw, 48px);
      height: clamp(36px, 3vw, 48px);
      border-radius: 50%;
      background: rgba(60, 145, 255, .7);
      backdrop-filter: blur(8px);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .3s, transform .3s;
      pointer-events: none;
      z-index: 999;
    }

    #back-top.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    #back-top:hover {
      background: rgba(60, 145, 255, .9);
    }

    #back-top svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>

<body>

  <header id="sticky-header">
    <div class="nav-title">
      <span>01</span>
      <span class="nav-title-name">Ai赋能篇</span>
    </div>
    <nav class="tabs-row" aria-label="主导航">
      <button class="tab-btn active">Vibe Coding</button>
      <button class="tab-btn">Ai内容生产</button>
      <button class="tab-btn">Ai赛事自驱</button>
    </nav>
  </header>

  <button id="back-top" title="回到顶部" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"
      stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15" />
    </svg>
  </button>

  <!-- SECTION 1: VibeCoding1 hero -->
  <section class="section-hero">
    <img class="bg" src="assets/Ai技能/Vibe Coding/VibeCoding1.png" alt="Vibe Coding Hero" draggable="false">
    <div class="nav-overlay" id="nav-overlay">
      <div class="nav-title">
        <span>01</span>
        <span class="nav-title-name">Ai赋能篇</span>
      </div>
      <nav class="tabs-row" aria-label="内容分类">
        <button class="tab-btn active">Vibe Coding</button>
        <button class="tab-btn">Ai内容生产</button>
        <button class="tab-btn">Ai赛事自驱</button>
      </nav>
    </div>
    <div class="logos-overlay" aria-hidden="true">
      <img src="assets/Ai技能/Vibe Coding/Antigravity.png" alt="Antigravity">
      <img src="assets/Ai技能/Vibe Coding/ClaudeCode.png" alt="Claude Code">
      <img src="assets/Ai技能/Vibe Coding/Codex.png" alt="Codex">
    </div>
  </section>

  <div class="section-gap"></div>

  <!-- SECTION 2: VibeCoding2 + H5 iframe -->
  <section class="section-2" id="section-2">
    <img class="bg" src="assets/Ai技能/Vibe Coding/VibeCoding2.png" alt="" draggable="false">
    <div class="h5-container" id="h5-container">
      <iframe id="h5-iframe" src="assets/Ai技能/Vibe Coding/h5/index.html" title="内嵌 H5 展示" allowfullscreen
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope"
        sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
    </div>
  </section>

  <!-- dark blur band (ILaWu) -->
  <div class="section-blur-band"></div>

  <!-- VibeCoding3 + handwriting overlays -->
  <div class="vc-wrap" id="vc3">
    <img class="bg" src="assets/Ai技能/Vibe Coding/VibeCoding3.png" alt="" draggable="false">
    <img class="handwriting" id="handwriting" src="assets/Ai技能/Vibe Coding/字迹.png" alt="" draggable="false">
    <img class="hand-pen" id="handPen" src="assets/Ai技能/Vibe Coding/手写笔.png" alt="" draggable="false">
  </div>

  <!-- VibeCoding4 + 难点讨论 card -->
  <div class="vc-wrap" id="vc4">
    <img class="bg" src="assets/Ai技能/Vibe Coding/VibeCoding4.png" alt="" draggable="false">
    <div class="discuss-card" id="discussCard">
      <img class="discuss-bg" src="assets/Ai技能/Vibe Coding/难点讨论-底图.png" alt="" draggable="false">
      <div class="discuss-list" id="discussList">
        <img class="discuss-row" src="assets/Ai技能/Vibe Coding/难点-1.png" alt="" draggable="false">
        <img class="discuss-row" src="assets/Ai技能/Vibe Coding/难点-2.png" alt="" draggable="false">
        <div class="discuss-divider"></div>
        <img class="discuss-row" src="assets/Ai技能/Vibe Coding/难点-3.png" alt="" draggable="false">
        <img class="discuss-row" src="assets/Ai技能/Vibe Coding/难点-4.png" alt="" draggable="false">
        <img class="discuss-row" src="assets/Ai技能/Vibe Coding/难点-5.png" alt="" draggable="false">
      </div>
    </div>
  </div>

  <!-- zV5Jg -->
  <img class="standalone-img" id="zv5jg" src="assets/Ai技能/Vibe Coding/逆向工作流.png" alt="逆向工作流" draggable="false"
    style="width: calc(876.5 / 1600 * 100%); margin: 0 auto calc(80 / 1600 * 100vw);">

  <!-- flow row: 6 imgs + 5 arrows -->
  <div class="flow-row" id="flowRow">
    <img class="flow-item" src="assets/Ai技能/Vibe Coding/流程-1.png" alt="" draggable="false">
    <span class="flow-arrow"></span>
    <img class="flow-item" src="assets/Ai技能/Vibe Coding/流程-2.png" alt="" draggable="false">
    <span class="flow-arrow"></span>
    <img class="flow-item" src="assets/Ai技能/Vibe Coding/流程-3.png" alt="" draggable="false">
    <span class="flow-arrow"></span>
    <img class="flow-item" src="assets/Ai技能/Vibe Coding/流程-4.png" alt="" draggable="false">
    <span class="flow-arrow"></span>
    <img class="flow-item" src="assets/Ai技能/Vibe Coding/流程-5.png" alt="" draggable="false">
    <span class="flow-arrow"></span>
    <img class="flow-item" src="assets/Ai技能/Vibe Coding/流程-6.png" alt="" draggable="false">
  </div>

  <!-- VibeCoding5 / 6 / 7 -->
  <img class="section-img" src="assets/Ai技能/Vibe Coding/VibeCoding5.png" alt="" draggable="false">
  <img class="section-img" src="assets/Ai技能/Vibe Coding/VibeCoding6.png" alt="" draggable="false">
  <img class="section-img" src="assets/Ai技能/Vibe Coding/VibeCoding7.png" alt="" draggable="false">

  <script>
    /* STICKY HEADER + BACK-TOP */
    const stickyHeader = document.getElementById('sticky-header');
    const backTop = document.getElementById('back-top');
    function navThreshold() { return window.innerWidth * (260 / 1600); }
    function onScroll() {
      const scrollY = window.scrollY;
      stickyHeader.classList.toggle('visible', scrollY > navThreshold());
      backTop.classList.toggle('visible', scrollY > window.innerHeight * 0.6);
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    /* H5 IFRAME scale-to-fit (375×812 design) */
    const iframe = document.getElementById('h5-iframe');
    const h5Container = document.getElementById('h5-container');
    const H5_W = 375, H5_H = 812;
    function scaleH5() {
      if (!h5Container || !iframe) return;
      const cW = h5Container.clientWidth, cH = h5Container.clientHeight;
      if (cW === 0 || cH === 0) return;
      const scale = Math.min(cW / H5_W, cH / H5_H);
      const offX = (cW - H5_W * scale) / 2;
      iframe.style.width = H5_W + 'px';
      iframe.style.height = H5_H + 'px';
      iframe.style.transform = `translateX(${offX}px) scale(${scale})`;
      iframe.style.transformOrigin = 'top left';
    }
    if (window.ResizeObserver) { new ResizeObserver(scaleH5).observe(h5Container); }
    window.addEventListener('resize', scaleH5, { passive: true });
    window.addEventListener('load', scaleH5);

    /* INTERACTION A — handwriting reveal (once) */
    (function () {
      const hw = document.getElementById('handwriting');
      const pen = document.getElementById('handPen');
      const vc3 = document.getElementById('vc3');
      if (!hw || !pen || !vc3) return;
      if (!('IntersectionObserver' in window) ||
        matchMedia('(prefers-reduced-motion: reduce)').matches) {
        hw.classList.add('writing'); pen.classList.add('writing'); return;
      }
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            hw.classList.add('writing');
            pen.classList.add('writing');
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0.35 });
      io.observe(vc3);
    })();

    /* INTERACTION B — 难点讨论 list (top→bottom), zV5Jg, flow row (left→right).
       Each item reveals on scroll-in; once-only. */
    (function () {
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const reveal = (el) => el.classList.add('revealed');
      const rows = Array.from(document.querySelectorAll('#discussList .discuss-row, #discussList .discuss-divider'));
      const flowItems = Array.from(document.querySelectorAll('#flowRow .flow-item, #flowRow .flow-arrow'));
      const zv5 = document.getElementById('zv5jg');
      if (reduce) {
        rows.forEach(reveal); flowItems.forEach(reveal);
        if (zv5) zv5.style.opacity = '1';
        return;
      }
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (!e.isIntersecting) return;
          reveal(e.target);
          io.unobserve(e.target);
        });
      }, { threshold: 0.5 });
      rows.forEach((r) => io.observe(r));
      // Flow row: stagger reveal left→right when the row enters view.
      const flowRow = document.getElementById('flowRow');
      if (flowRow) {
        const fio = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (!e.isIntersecting) return;
            flowItems.forEach((f, i) => setTimeout(() => reveal(f), i * 150));
            fio.unobserve(e.target);
          });
        }, { threshold: 0.3 });
        fio.observe(flowRow);
      }
      if (zv5) {
        zv5.style.opacity = '0';
        zv5.style.transition = 'opacity .5s ease';
        const zio = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (!e.isIntersecting) return;
            zv5.style.opacity = '1';
            zio.unobserve(e.target);
          });
        }, { threshold: 0.4 });
        zio.observe(zv5);
      }
    })();
  </script>
</body>

</html>
